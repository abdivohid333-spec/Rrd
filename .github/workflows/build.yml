name: APK Guard — Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p _extracted
            unzip -o "$ZIP_FILE" -d _extracted
            INNER=$(find _extracted -maxdepth 1 -mindepth 1 -type d | head -1)
            if [ -n "$INNER" ] && [ -f "$INNER/settings.gradle.kts" ]; then
              echo "PROJECT_DIR=$INNER" >> $GITHUB_ENV
            elif [ -f "_extracted/settings.gradle.kts" ]; then
              echo "PROJECT_DIR=_extracted" >> $GITHUB_ENV
            else
              echo "PROJECT_DIR=." >> $GITHUB_ENV
            fi
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cd "$PROJECT_DIR"
          mkdir -p apk_output
          find . -name "*.apk" -not -path "*/intermediates/*" | while read f; do
            cp "$f" apk_output/
          done
          ls -lh apk_output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APKGuard-debug
          path: ${{ env.PROJECT_DIR }}/apk_output/*.apk
          if-no-files-found: error
          retention-days: 30
